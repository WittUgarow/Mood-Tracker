<!DOCTYPE html>
<html>
<head>
  <title>Create Entry</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/entry.css">
</head>

<body>

  <div class="page">

    <div class="card entry-panel">

      <h2>Create New Entry</h2>
      <p class="subtext">Adjust your emotions (0–100)</p>

      <div class="emotion-slider">
        <label>Happy</label>
        <input type="range" min="0" max="100" value="50">
      </div>

      <div class="emotion-slider">
        <label>Sad</label>
        <input type="range" min="0" max="100" value="50">
      </div>

      <div class="emotion-slider">
        <label>Stress</label>
        <input type="range" min="0" max="100" value="50">
      </div>

      <div class="emotion-slider">
        <label>Excited</label>
        <input type="range" min="0" max="100" value="50">
      </div>

      <div class="emotion-slider">
        <label>Calm</label>
        <input type="range" min="0" max="100" value="50">
      </div>

      <div class="emotion-slider">
        <label>Focused</label>
        <input type="range" min="0" max="100" value="50">
      </div>

      <button class="create-btn">Create Entry</button>

    </div>

  </div>

</body>
</html>
