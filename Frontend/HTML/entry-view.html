
<!DOCTYPE html>
<html>
<head>
  <title>Entry View</title>
  <link rel="stylesheet" href="../CSS/base.css">
  <link rel="stylesheet" href="../CSS/entry-view.css">
</head>

<body>

  <div class="page">

    <div class="card entry-view-panel">

      <div class="entry-header">
        <h2>Entry #12</h2>
        <p class="date">Wednesday 20/5/2026 - 4:27 PM</p>
      </div>

      <div class="emotions">

        <div class="emotion-row">
          <span class="label">Happy</span>
          <span class="value">72</span>
          <div class="bar"><div class="fill" style="width:72%"></div></div>
        </div>

        <div class="emotion-row">
          <span class="label">Hopeful</span>
          <span class="value">45</span>
          <div class="bar"><div class="fill" style="width:45%"></div></div>
        </div>

        <div class="emotion-row">
          <span class="label">Content</span>
          <span class="value">30</span>
          <div class="bar"><div class="fill" style="width:30%"></div></div>
        </div>

        <div class="emotion-row">
          <span class="label">Irritated</span>
          <span class="value">10</span>
          <div class="bar"><div class="fill" style="width:10%"></div></div>
        </div>

        <div class="emotion-row">
          <span class="label">Anxious</span>
          <span class="value">25</span>
          <div class="bar"><div class="fill" style="width:25%"></div></div>
        </div>

        <div class="emotion-row">
          <span class="label">Depressed</span>
          <span class="value">5</span>
          <div class="bar"><div class="fill" style="width:5%"></div></div>
        </div>

      </div>

    </div>

  </div>

</body>
</html>
