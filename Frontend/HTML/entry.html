<!DOCTYPE html>
<html>
<head>
  <title>Create Entry</title>
  <link rel="stylesheet" href="../CSS/base.css">
  <link rel="stylesheet" href="../CSS/entry.css">
</head>

<body>

  <div class="page">

    <div class="card entry-panel">

      <h2>Create New Entry</h2>
      <p class="subtext">Adjust your emotions (0–100)</p>

      <div class="emotion-slider">
        <label>Happy</label>
        <input type="range" min="0" max="100" value="50" id="happySlider">
      </div>

      <div class="emotion-slider">
        <label>Hopeful</label>
        <input type="range" min="0" max="100" value="50" id="hopefulSlider">
      </div>

      <div class="emotion-slider">
        <label>Content</label>
        <input type="range" min="0" max="100" value="50" id="contentSlider">
      </div>

      <div class="emotion-slider">
        <label>Irritated</label>
        <input type="range" min="0" max="100" value="50" id="irritatedSlider">
      </div>

      <div class="emotion-slider">
        <label>Anxious</label>
        <input type="range" min="0" max="100" value="50" id="anxiousSlider">
      </div>

      <div class="emotion-slider">
        <label>Depressed</label>
        <input type="range" min="0" max="100" value="50" id="depressedSlider">
      </div>

      <button id="create-btn">Create Entry</button>

    </div>

  </div>
  <script src="../JS/entry.js"></script>
</body>
</html>
